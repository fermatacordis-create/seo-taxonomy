name: STAGING a PRODUCCION

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      target_plugin:
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: taxocommerce-site-delivery
  cancel-in-progress: false

jobs:
  deploy:
    name: Sincronizar TODOS los plugins desde STAGING a PRO
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Obtener el codigo de STAGING
        uses: actions/checkout@v6
        with:
          ref: staging
          fetch-depth: 0

      - name: Comprobar revision aprobada, si procede
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "staging"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ -n "$EXPECTED_SHA" ]; then
            if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
              echo "::error::STAGING ha cambiado desde la aprobacion."
              exit 1
            fi
          fi

      - name: Seleccionar archivos nuevos y modificados desde el ultimo PRO verificado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/select_pro_release_delta.py --all-changed --output pro-delta.json

      - name: Subir solo el delta Git por FTPS (sin comparar archivos remotos)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 .github/scripts/deploy_pro_ftps_native.py pro-delta.json
