  plan:
    name: Select changed deployable plugin files
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.changed.outputs.base }}
      slugs: ${{ steps.changed.outputs.slugs }}
      count: ${{ steps.changed.outputs.count }}
      core: ${{ steps.changed.outputs.core }}
      sync: ${{ steps.changed.outputs.sync }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare against latest verified successful staging release
        id: changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAXOCOMMERCE_FULL_SYNC: ${{ inputs.full_sync && '1' || '0' }}
          # Only the Git delta is selected. Never inventory plugins from WordPress
          # or convert an incremental upload into a whole-family reconciliation.
          STAGING_FTP_SERVER: ${{ secrets.STAGING_FTP_SERVER }}
          STAGING_FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
          STAGING_FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
          # Called workflows inherit the caller's github event. Scope only a
          # direct workflow push, not the standard gated reusable workflow.
          TAXOCOMMERCE_TARGET_PLUGIN: ${{ inputs.target_plugin || '' }}
        run: python3 .github/scripts/deploy_staging_delta.py plan

  deploy-staging:
    name: STAGING / ${{ matrix.slug }}
    needs: plan
    if: needs.plan.result == 'success' && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        slug: ${{ fromJSON(needs.plan.outputs.slugs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Upload only changed files to STAGING using shared FTPS login
        # Account root: /home/hosting160568eu/public_html
        # Target path: ./staging.distribuidordeherramientas.es/wp-content/plugins/<slug>/
        env:
          STAGING_FTP_SERVER: ${{ secrets.STAGING_FTP_SERVER }}
          STAGING_FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
          STAGING_FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
          BASE: ${{ needs.plan.outputs.base }}
          SLUG: ${{ matrix.slug }}
          SYNC: ${{ needs.plan.outputs.sync }}
          TAXOCOMMERCE_TARGET_PLUGIN: ${{ inputs.target_plugin || '' }}
        # deploy() has a bounded 3-attempt reconnect loop; never retry it 3x in bash.
        # Unbuffered output records progress and the actual failing FTPS phase.
        run: python3 -u .github/scripts/deploy_staging_delta.py deploy --base "$BASE" --target staging --slug "$SLUG" --full "$SYNC"

  deploy-focazul:
    name: Focazul / ${{ matrix.slug }}
    # Both sites use the same FTP service. Finish STAGING connections first.
    # always() still runs Focazul when STAGING fails (separate failure reporting).
    needs: [plan, deploy-staging]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        slug: ${{ fromJSON(needs.plan.outputs.slugs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Upload verified changed plugin files to Focazul
        env:
          STAGING_FTP_SERVER: ${{ secrets.STAGING_FTP_SERVER }}
          STAGING_FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
          STAGING_FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
          BASE: ${{ needs.plan.outputs.base }}
          SLUG: ${{ matrix.slug }}
          SYNC: ${{ needs.plan.outputs.sync }}
          TAXOCOMMERCE_TARGET_PLUGIN: ${{ inputs.target_plugin || '' }}
        # deploy() has a bounded 3-attempt reconnect loop; never retry it 3x in bash.
        # Unbuffered output records progress and the actual failing FTPS phase.
        run: python3 -u .github/scripts/deploy_staging_delta.py deploy --base "$BASE" --target focazul --slug "$SLUG" --full "$SYNC"

  verify:
    name: Require successful delivery to every applicable site
    needs: [plan, deploy-staging, deploy-focazul]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check results without accepting partial success
        env:
          PLAN: ${{ needs.plan.result }}
          COUNT: ${{ needs.plan.outputs.count }}
          CORE: ${{ needs.plan.outputs.core }}
          STAGING: ${{ needs.deploy-staging.result }}
          FOCAZUL: ${{ needs.deploy-focazul.result }}
        run: |
          set -euo pipefail
          echo "Plan: $PLAN; plugin changes: $COUNT; Core changed: $CORE"
          echo "STAGING: $STAGING; Focazul: $FOCAZUL"
          test "$PLAN" = "success"
          if [ "$COUNT" != "0" ]; then
            test "$STAGING" = "success"
          fi
          if [ "$COUNT" != "0" ]; then
            test "$FOCAZUL" = "success"
          fi
          echo "All applicable deployments completed successfully"
      - uses: actions/checkout@v4
      - name: Verify and repair tracked Core file parity on both installations
        if: needs.plan.outputs.core == 'true'
        env:
          STAGING_FTP_SERVER: ${{ secrets.STAGING_FTP_SERVER }}
          STAGING_FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
          STAGING_FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
        run: python3 .github/scripts/deploy_staging_delta.py reconcile-core
      - name: Audit WordPress MO catalogues on STAGING after Core delivery
        if: needs.plan.outputs.core == 'true'
        env:
          STAGING_FTP_SERVER: ${{ secrets.STAGING_FTP_SERVER }}
          STAGING_FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
          STAGING_FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
        run: python3 .github/scripts/audit_staging_mo.py
      - name: Read-only comparison of Core and both WordPress menus (no site writes)
        # Audit only when Core changes. A no-op or an unrelated module must not
        # hold the shared site delivery lock for minutes without uploading.
        if: needs.plan.outputs.core == 'true'
        continue-on-error: true
        env:
          STAGING_FTP_SERVER: ${{ secrets.STAGING_FTP_SERVER }}
          STAGING_FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
          STAGING_FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
          TC_STAGING_WP_USER: ${{ secrets.TC_STAGING_WP_USER }}
          TC_STAGING_WP_PASSWORD: ${{ secrets.TC_STAGING_WP_PASSWORD }}
          TC_FOCAZUL_WP_USER: ${{ secrets.TC_FOCAZUL_WP_USER }}
          TC_FOCAZUL_WP_PASSWORD: ${{ secrets.TC_FOCAZUL_WP_PASSWORD }}
        run: python3 .github/scripts/audit_core_dual_sites.py --out core-dual-audit/report
      - name: Preserve cross-site audit report (including failed and unchecked results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-dual-site-audit-${{ github.run_id }}
          path: |
            core-dual-audit/report.json
            core-dual-audit/report.md
          if-no-files-found: ignore
          retention-days: 30

  ticketing-package:
    name: Publish verified Ticketing ZIP to STAGING and Focazul package repositories
    needs: verify
    if: github.event_name == 'push' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Select only Ticketing delivery changes
        id: ticketing
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only HEAD^ HEAD | grep -Eq '^(taxocommerce-ticketing/|docs/focazul-taxocommerce-ticketing.html|.github/scripts/publish_ticketing_)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify and publish Ticketing ZIP only (never PRO)
        if: steps.ticketing.outputs.changed == 'true'
        env:
          STAGING_FTP_SERVER: ${{ secrets.STAGING_FTP_SERVER }}
          STAGING_FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
          STAGING_FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
        run: python3 -u .github/scripts/publish_ticketing_package.py

  ticketing-page:
    name: Publish editable Ticketing information page to Focazul only
    needs: [verify, ticketing-package]
    if: github.event_name == 'push' && needs.verify.result == 'success' && needs.ticketing-package.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Update only if the Focazul Ticketing page content changed
        shell: bash
        env:
          TC_FOCAZUL_WP_USER: ${{ secrets.TC_FOCAZUL_WP_USER }}
          TC_FOCAZUL_WP_PASSWORD: ${{ secrets.TC_FOCAZUL_WP_PASSWORD }}
        run: |
          set -euo pipefail
          if git diff --name-only HEAD^ HEAD | grep -Fxq 'docs/focazul-taxocommerce-ticketing.html'; then
            python3 -u .github/scripts/publish_focazul_ticketing_page.py
          else
            echo "Focazul Ticketing page unchanged; no WordPress modification."
          fi

  mail-package:
    name: Publish verified Mail ZIP to STAGING and Focazul package repositories
    # Serialize FTP operations with the existing Ticketing release jobs.
    needs: [verify, ticketing-page]
    if: github.event_name == 'push' && needs.verify.result == 'success' && needs.ticketing-page.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Select only Mail changes
        id: mail
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only HEAD^ HEAD | grep -Eq '^(taxocommerce-mail/|\.github/scripts/publish_mail_package\.py)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify and publish Mail ZIP only (never PRO)
        if: steps.mail.outputs.changed == 'true'
        env:
          STAGING_FTP_SERVER: ${{ secrets.STAGING_FTP_SERVER }}
          STAGING_FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
          STAGING_FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
        run: python3 -u .github/scripts/publish_mail_package.py

  mail-pro-package:
    name: Publish independent Mail Pro ZIP to STAGING and Focazul package repositories
    needs: [verify, mail-package]
    if: github.event_name == 'push' && needs.verify.result == 'success' && needs.mail-package.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Select only Mail Pro changes
        id: mailpro
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only HEAD^ HEAD | grep -Eq '^(taxocommerce-mail-pro/|\.github/scripts/publish_mail_pro_package\.py)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify and publish Mail Pro ZIP only (never production)
        if: steps.mailpro.outputs.changed == 'true'
        env:
          STAGING_FTP_SERVER: ${{ secrets.STAGING_FTP_SERVER }}
          STAGING_FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
          STAGING_FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
        run: python3 -u .github/scripts/publish_mail_pro_package.py
